# Example PipelineRun for Paco AI code reviewer.
#
# Copy this file to .tekton/paco.yaml in your repository and update
# the values marked CHANGEME below.
#
# This example uses the Anthropic API. For Claude on Vertex AI, see
# pipelinerun.yaml.
#
# Triggers:
#   - Automatically on pull_request opened/reopened to "main".
#   - On-demand via a "/paco review" or "/paco summary" PR comment.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: paco
  annotations:
    # Auto-trigger on PR events targeting main.
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "main" && (body.action == "opened" || body.action == "reopened")
    # On-demand trigger via PR comment: "/paco review" or "/paco summary".
    pipelinesascode.tekton.dev/on-comment: "^/paco[[:space:]]+(review|summary)[[:space:]]*$"
    pipelinesascode.tekton.dev/max-keep-runs: "2"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  taskRunTemplate:
    podTemplate:
      securityContext:
        fsGroup: 65532
  params:
    - name: repo_owner
      value: "{{repo_owner}}"
    - name: repo_name
      value: "{{repo_name}}"
    - name: pull_request_number
      value: "{{pull_request_number}}"
    - name: trigger_comment
      value: |
        {{ trigger_comment }}
    # Extract the comment ID from the webhook body so paco can add an
    # eyes reaction to acknowledge the trigger. Empty for PR events.
    - name: comment_id
      value: "{{ cel: has(body.comment) && has(body.comment.id) ? string(body.comment.id) : '' }}"
    - name: git_auth_secret
      value: "{{git_auth_secret}}"
    # Tracks main. Use a release tag or digest to pin the image.
    - name: image
      value: "ghcr.io/pipelines-as-code/paco-cli:latest"
    # Optional: Claude model id. Empty means claude-opus-4-6.
    - name: model
      value: ""
    # Optional: reasoning effort for the model.
    # One of none (omit), low, medium, high, xhigh, max. Empty means low.
    - name: reasoning_effort
      value: ""
    - name: no_structured_output
      value: "true"
    # Set false to disable public-documentation search.
    - name: web_search
      value: "true"
    - name: verify_findings
      value: "false"
    # CHANGEME: name of the Kubernetes secret holding the Anthropic API key.
    - name: anthropic_secret
      value: "paco-anthropic-api-key"
    # CHANGEME: key inside the secret that contains the API key.
    - name: anthropic_secret_key
      value: "api-key"
  pipelineSpec:
    params:
      - name: repo_owner
      - name: repo_name
      - name: pull_request_number
      - name: trigger_comment
      - name: comment_id
        default: ""
      - name: git_auth_secret
      - name: image
        default: "ghcr.io/pipelines-as-code/paco-cli:latest"
      - name: model
        default: ""
      - name: reasoning_effort
        default: ""
      - name: no_structured_output
        default: "true"
      - name: web_search
        default: "true"
      - name: verify_findings
        default: "false"
      - name: anthropic_secret
        default: "paco-anthropic-api-key"
      - name: anthropic_secret_key
        default: "api-key"
    tasks:
      - name: paco-review
        taskSpec:
          workspaces:
            - name: source
          steps:
            # Step 1: Fetch the PR diff and existing feedback.
            - name: compute-diff
              displayName: "Fetch PR diff via paco"
              image: "$(params.image)"
              imagePullPolicy: Always
              env:
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "$(params.git_auth_secret)"
                      key: "git-provider-token"
              command: ["/ko-app/paco", "diff"]
              args:
                - "--repo=$(params.repo_owner)/$(params.repo_name)"
                - "--pr=$(params.pull_request_number)"
                - "--comment-id=$(params.comment_id)"
                - "--workspace=$(workspaces.source.path)"

            # Step 2: Run the AI review.
            - name: paco-review
              displayName: "Run Paco review"
              image: "$(params.image)"
              imagePullPolicy: Always
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: "$(params.anthropic_secret)"
                      key: "$(params.anthropic_secret_key)"
                - name: TRIGGER_COMMENT
                  value: "$(params.trigger_comment)"
              command: ["/ko-app/paco", "review"]
              args:
                - "--workspace=$(workspaces.source.path)"
                - "--model=$(params.model)"
                - "--reasoning-effort=$(params.reasoning_effort)"
                - "--no-structured-output=$(params.no_structured_output)"
                - "--web-search=$(params.web_search)"
                - "--verify-findings=$(params.verify_findings)"

            # Step 3: Post the review results to the pull request.
            - name: post-review
              displayName: "Post review to the pull request"
              image: "$(params.image)"
              imagePullPolicy: Always
              env:
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: "$(params.git_auth_secret)"
                      key: "git-provider-token"
              command: ["/ko-app/paco", "post"]
              args:
                - "--repo=$(params.repo_owner)/$(params.repo_name)"
                - "--pr=$(params.pull_request_number)"
                - "--workspace=$(workspaces.source.path)"
    workspaces:
      - name: source
  workspaces:
    - name: source
      emptyDir: {}
